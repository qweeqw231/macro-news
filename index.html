<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宏观资讯台 · 全球利率 / 汇率 / 政策 / 大宗</title>
<meta name="description" content="全球宏观资讯自动采集台：央行政策、利率、汇率、大宗商品行情与要闻归档。" />
<link rel="stylesheet" href="assets/style.css?v=20261005g" />
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <a class="logo" href="./">MACRO<span>·</span>NEWS</a>
    <nav class="hd-nav" aria-label="主导航">
      <button class="tab active" data-view="feed">要闻流</button>
      <button class="tab" data-view="archive">归档</button>
      <button class="tab" data-view="sources">来源</button>
      <button class="tab" data-view="status">运行状态</button>
    </nav>
  </div>
</header>

<main class="page">

  <!-- ============ 宏观仪表盘 ============ -->
  <section class="board" id="board" aria-label="宏观行情">
    <div class="board-hd">
      <h1>宏观仪表盘</h1>
      <span class="board-time" id="quoteTime"></span>
    </div>
    <div class="quotes" id="quotes"><div class="skeleton">行情载入中…</div></div>
  </section>

  <!-- ============ 搜索 ============ -->
  <section class="searchbar">
    <div class="sb-in">
      <span class="sb-ico" aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="全文检索：标题 / 摘要 / 来源（如：降息、CPI、黄金、原油）" autocomplete="off" />
      <button id="qClear" class="sb-clear" type="button" hidden aria-label="清空">×</button>
    </div>
    <div class="sb-meta" id="qMeta"></div>
  </section>

  <!-- ============ 要闻流 ============ -->
  <section class="view" id="view-feed">
    <div class="filters" id="filters"></div>
    <div class="list" id="feed"></div>
    <button class="more" id="moreBtn" hidden>加载更早的条目</button>
  </section>

  <!-- ============ 归档 ============ -->
  <section class="view" id="view-archive" hidden>
    <div class="days" id="days"></div>
  </section>

  <!-- ============ 来源 ============ -->
  <section class="view" id="view-sources" hidden>
    <div id="sources"></div>
  </section>

  <!-- ============ 运行状态 ============ -->
  <section class="view" id="view-status" hidden>
    <div id="status"></div>
  </section>

  <!-- ============ K线图抽屉 ============ -->
  <div class="kline-modal" id="klineModal" hidden>
    <div class="km-box">
      <div class="km-hd">
        <div class="km-title">
          <strong id="kmName">—</strong>
          <span class="km-price" id="kmPrice"></span>
        </div>
        <button class="km-close" id="kmClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="km-periods" id="kmPeriods"></div>
      <div class="km-canvas" id="kmCanvas"></div>
      <div class="km-note" id="kmNote"></div>
    </div>
  </div>

  <!-- ============ 站内阅读器 ============ -->
  <div class="reader-modal" id="readerModal" hidden>
    <div class="rd-box" role="dialog" aria-modal="true" aria-labelledby="rdTitle">
      <div class="rd-hd">
        <div class="rd-meta">
          <span class="rd-src" id="rdSource"></span>
          <span class="rd-time" id="rdTime"></span>
          <span class="rd-time" id="rdChannel"></span>
        </div>
        <button class="rd-close" id="rdClose" type="button" aria-label="关闭">×</button>
      </div>
      <h2 class="rd-title" id="rdTitle"></h2>
      <div class="rd-body" id="rdBody"></div>
      <div class="rd-ft">
        <a class="rd-link" id="rdLink" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a>
        <div class="rd-nav">
          <button class="rd-nav-btn" id="rdPrev" type="button">← 上一条</button>
          <button class="rd-nav-btn" id="rdNext" type="button">下一条 →</button>
        </div>
      </div>
    </div>
  </div>

</main>

<footer class="ft">
  <p>宏观资讯台 · 自动采集自华尔街见闻 / 东方财富 / 新浪财经 / 中新网 / 中国人民银行 / 美联储 / 欧洲央行 / 国家统计局</p>
  <p id="ftMeta"></p>
</footer>

<script src="assets/config.js?v=20261005g"></script>
<script src="assets/fuse.min.js?v=20261005g"></script>
<script src="assets/market.js?v=20261005g"></script>
<script src="assets/kline.js?v=20261005g"></script>
<script src="assets/app.js?v=20261005g"></script>
</body>
</html>
