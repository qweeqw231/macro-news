name: 全量日K刷新

# 每天生成一次「服务端预生成的全量日K」：data/kline/<key>_full.json
#
# 另外在这一轮里**顺带刷新日K / 周K / 月K**（data/kline/<key>.json / _1w.json / _1M.json）：
#   · 2026-10-30 之前，这三档是由 collect.yml 每轮顺带刷的；
#   · 现在要闻流采集改成 `--no-kline`（只抓新闻，快、且不打扰东财），
#     日/周/月 K 挪到这里每日刷一次 —— 日K 每天变、周K 一周变、月K 一月变，一天足够；
#   · 好处：把「每轮 63 个 K 线请求」从「每 ~9 分钟」降到「每天一次」，
#     撞东财按 IP 限流的概率小一个数量级（限流是常态，不是意外）。
#
# 为什么必须放在 Actions 而不是只在本地跑（2026-10-30 实测）：
#   · 东财 push2his 对**消费级 IP**会做 socket 级拒绝（`UND_ERR_SOCKET`），
#     本机 Node 连不上 ⇒ 港/美/日/德/英/韩这 9 个指数的长历史在**本机根本取不到**
#     （腾讯只给 1000 根，新浪不覆盖这些品种）⇒ 上一轮 21 个目标里有 13 个生成失败；
#   · Actions 跑在美国节点 ⇒ 同一个脚本能拿到东财的全量（纳斯达克 8865 根 / 1991 年起）；
#   · 脚本自身「每天最多更新一次」（按文件里的 generatedAt 判断）⇒ 一天只会真跑一轮，
#     不会把配额烧掉（本地 16:30 的任务也会被这个判断去重，不会重复写）。
#
# 与其它写分支的 workflow **各自独立** concurrency group
#   ⇒ 互不排队、互不取消（GitHub 的 concurrency group 会把 pending 的那个取消掉）；
#   万一同时推 main，由 scripts/push-data.sh 负责 fetch + rebase 重试。

on:
  schedule:
    # UTC 04:23 = 北京 12:23（避开通盘与本地 16:30 那轮）
    - cron: '23 4 * * *'
  # 允许手动触发，方便验证
  workflow_dispatch:
  # 改了取数逻辑 / 本文件就立刻跑一次（不用等定时）。
  # ⚠ 路径过滤刻意**不含 data/**：本 workflow 自己提交 data/kline/*_full.json，
  #   若把 data/ 纳入触发条件，就会「提交 → 触发 → 再提交」的循环。
  push:
    branches: [main]
    paths:
      - '.github/workflows/kline-full.yml'
      - 'scripts/update-kline-full.mjs'
      - 'src/sources.mjs'

permissions:
  contents: write

concurrency:
  group: macro-news-kline-full
  cancel-in-progress: false

jobs:
  kline-full:
    runs-on: ubuntu-latest
    # ⚠ 20 → 30 分钟：全量日K（21 个标的的完整历史）+ 日/周/月K（21×3 个请求）
    #   都打东财，按 IP 限流时每个请求可能耗到 20 秒硬超时。
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史才能 git push

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 采集器零依赖，无需 npm install
      - name: 生成全量日K
        run: node scripts/update-kline-full.mjs

      # 日K / 周K / 月K（21 个标的 × 3 个周期）—— 每天才刷一次，搬到这里
      # ⚠ 单个周期失败不影响其它周期（采集器内部逐周期 try/catch），
      #   失败时保留上一轮的旧文件，不会把图表打空。
      - name: 刷新日K / 周K / 月K
        continue-on-error: true
        run: node src/collect.mjs --kline-only

      - name: 提交并推送（仅在数据有变化时）
        # ⚠ 必须整行加引号：plain scalar 里的 `: ` 会让 YAML 解析失败
        run: 'bash scripts/push-data.sh data/kline MSG_PREFIX="data: K线日更（全量 + 日/周/月）"'
