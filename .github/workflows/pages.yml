name: Pages 部署（自定义 Actions）

# 为什么不再用「Deploy from a branch」：
#   GitHub Pages 对「分支构建」有 **10 次/小时** 的软上限（官方文档 GitHub Pages limits）。
#   本站每 15 分钟一轮采集、四条 workflow 各自 push，实测峰值已经打到 10 次/小时
#   ⇒ 超出的构建会被跳过/取消，表现为「线上内容比仓库旧」，而且不报错、不易察觉。
#   官方原文：该限制 *does not apply if you build and publish your site with a custom
#   GitHub Actions workflow* —— 所以改成 Actions 部署后，10 次/小时 不再适用于本站。
#
# 与另外四条写数据 workflow 的关系：
#   · 本 workflow **只读仓库、只发 Pages 部署**，不写分支，不参与 data 的推送竞争；
#   · 部署并发组独立（group: pages），且 cancel-in-progress: false
#     ⇒ 连续提交不会互相取消部署，最坏只是排队；这与仓库既有的
#     「四条写分支 workflow 各自独立 concurrency、不连环取消」是同一个原则。
#   · ⚠ 2026-11-22 起并发组挂在 deploy **作业**上，不再挂在 workflow 级：
#     挂 workflow 级时，整个运行（含只读的 guard）都占住 pages 组，同一 SHA 的第二次
#     触发只能等第一次跑完才轮到 guard ⇒ guard 的「进行中」判据永远看不到对方，
#     实际只剩「已完成部署」这一条判据。移到作业级后 guard 立即并行执行（只读、约 5 秒），
#     deploy 仍然严格串行，两层机制不再互相遮蔽。
#
# ⚠ 两个体积相关的坑：
#   1) 站点约 131 MB，每次部署都要打包上传一次。upload-pages-artifact 打包时
#      排除 .git 与 .github，所以上传的是工作树而不是 260 MB；
#   2) artifact 保留期必须显式设 1 天。默认值目前也是 1，但一旦被改成 90 天，
#      按 160 次/天 × 131 MB 会把 Actions artifact 存储堆到 TB 级。

on:
  push:
    branches: [main]
    # 纯文档改动不需要重新发布站点，省掉一部分部署
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/collect.yml'
      - '.github/workflows/kline-full.yml'
      - '.github/workflows/kline-minute.yml'
      - '.github/workflows/snapshot.yml'
  # ⚠ 必须有定时兜底，不能只靠 push：
  #   采集任务在 Actions 里用默认 GITHUB_TOKEN 推分支，而「用 GITHUB_TOKEN 推送不会触发其它
  #   workflow」（GitHub 的既有防递归规则）。切到 Actions 部署后，这类推送既不会触发本
  #   workflow，也不会再有分支构建兜底 ⇒ 站点会停在旧内容（2026-11-15 切换当天实测发生过）。
  #   每 15 分钟扫一次 main，谁推的都能被发布出去。
  schedule:
    - cron: '*/15 * * * *'
  # 手动触发：切换 Pages 源之后用它做第一次验证
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 避免「同一 SHA 重复部署」，两层判据：
  #   1) 已完成的部署：github-pages 环境最近一次 deployment 的 SHA 与本轮相同 ⇒ 跳过；
  #   2) 未完成的部署：同一 head_sha 已有 queued / in_progress / waiting / pending / requested
  #      的 pages.yml 运行 ⇒ 先等它（最多 120 秒），再按部署记录决定；仍没完成就交给它。
  # 为什么需要 2)：push 与 schedule / dispatch 可能在几十秒内抢同一 SHA。此时第一条
  #   已经过了 guard、正在部署，但 github-pages 的 deployment 记录还没出现 ⇒ 只看 1)
  #   会漏判。2026-11-21 21:23 的 schedule/dispatch 同 SHA 对就是这种重叠。
  # 为什么只认「更早的运行」（run_id 更小）：两条运行同时起跑时，如果互相把对方算作
  #   「进行中」就会**互相跳过**，这个 SHA 反而没人部署。用 run_id 做确定性排序
  #   （GitHub 的 run_id 单调递增），只把更早的那条当作「将要部署的人」，后到者让路。
  # 陈旧判定：以运行 created_at 计时，超过 15 分钟仍未完成的一律忽略。
  #   依据：deploy 作业 timeout-minutes: 15，且正常一次部署实测 41~47 秒；超过 15 分钟
  #   仍处于 queued / in_progress 的只可能是平台侧卡单或记录滞后，不能让它永久挡住后续部署。
  # 与 concurrency 的分工（不重叠）：
  #   · guard：只读、不占 pages 组，负责「同一 SHA 去重」；
  #   · deploy 作业的 group: pages（cancel-in-progress: false）：负责「不同 SHA 串行」，
  #     只保证排队、不互相取消。即使 guard 因 API 延迟漏判，deploy 也只会排队，不会并发部署。
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      actions: read
    outputs:
      need: ${{ steps.check.outputs.need }}
    steps:
      - name: 判断是否已有同 SHA 的部署或更早的未完成运行
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          last_sha() {
            gh api "repos/$REPO/deployments?environment=github-pages&per_page=1" \
              --jq '.[0].sha' 2>/dev/null || echo ""
          }
          # 同一 SHA、run_id 更小（更早创建）、尚未完成且未超过 15 分钟的运行数
          active_earlier() {
            gh api "repos/$REPO/actions/workflows/pages.yml/runs?head_sha=$SHA&per_page=30" \
              --jq "[.workflow_runs[]
                     | select(.id < ${RUN_ID})
                     | select(.status == \"queued\" or .status == \"in_progress\"
                              or .status == \"waiting\" or .status == \"pending\"
                              or .status == \"requested\")
                     | select((now - (.created_at | fromdateiso8601)) < 900)] | length" \
              2>/dev/null || echo "0"
          }

          LAST=$(last_sha)
          ACTIVE=$(active_earlier)
          if [ -n "$LAST" ] && [ "$LAST" = "$SHA" ]; then
            echo "HEAD=$SHA LAST=$LAST ACTIVE=${ACTIVE:-0}"
            echo "同一 SHA 已完成部署，跳过"
            echo "need=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${ACTIVE:-0}" -gt 0 ]; then
            echo "同一 SHA 还有 $ACTIVE 个更早的未完成运行，最多等 120 秒看它是否完成部署"
            for _ in $(seq 1 12); do
              sleep 10
              ACTIVE=$(active_earlier)
              [ "${ACTIVE:-0}" -eq 0 ] && break
            done
            # 等待期间对方可能已经部署完成，重新读一次部署记录
            LAST=$(last_sha)
          fi

          echo "HEAD=$SHA LAST=$LAST ACTIVE=${ACTIVE:-0}"
          if [ -n "$LAST" ] && [ "$LAST" = "$SHA" ]; then
            echo "同一 SHA 已完成部署（等待期间完成），跳过"
            echo "need=false" >> "$GITHUB_OUTPUT"
          elif [ "${ACTIVE:-0}" -gt 0 ]; then
            echo "同一 SHA 仍有 $ACTIVE 个更早的未完成运行，交给它部署，跳过"
            echo "need=false" >> "$GITHUB_OUTPUT"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.need == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只有 deploy 进 pages 组：不同 SHA 串行部署、互不取消；guard 不占组，可并行去重。
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      # 首次部署失败（artifact 列表竞态）时 page_url 为空，回退到重试步骤的输出
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 部署只需要工作树，不需要历史（历史 129 MB，白拉）
          fetch-depth: 1

      - name: 生成检索索引（不进 git，只进 artifact）
        # search.json 与 search-history/* 自 2.33.1 起不再提交到仓库，由这里用
        # data/archive + data/history 现算。失败必须让整次部署失败：
        # 宁可站点停在上一版，也不发布「页面正常但搜索空白」的版本。
        run: node scripts/build-search.mjs

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # 显式写死：站点 131 MB × 每天约 160 次部署，保留 90 天就是 TB 级
          retention-days: 1

      - name: 部署到 GitHub Pages
        id: deployment
        # 已知竞态（2026-11-20 21:23 实测，约 2%）：upload 成功 0.33s 后，
        # deploy 侧查 artifact 列表偶尔仍返回 0 条，报 "Artifact not found"。
        # 这不是产物问题，等几秒重试一次即可；症状固定且不会自愈到下次 HEAD 前进。
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 等待 artifact 入列表
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: 部署重试（artifact 列表竞态）
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
