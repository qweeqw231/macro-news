name: 外汇分钟重叠核对（一次性）

# 目的：回答「美元对分钟能不能从东财切到新浪」。
#   · 东财 push2his 对**本机的非浏览器客户端**是 socket 级拒绝 ⇒ 本地拿不到东财那一半；
#   · 只有 Actions（美国节点）能同时抓到东财与新浪 ⇒ 核对必须在这里跑。
#
# 产物：2026-11-21/kline-minute-audit/work/overlap-actions.json（提交回仓库，匿名可读）
# 判定口径写在 scripts/check-fx-minute-overlap.mjs 顶部（p99 ≤ 0.05%、公共键 ≥ 200）。
#
# ⚠ 这是一次性核对，核对完由人工删除本文件与脚本，不并入日常调度。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = 7 个美元对逐根比对；probe-cross = 探测交叉盘的东财代码'
        required: false
        default: 'check'
  push:
    branches: [main]
    paths:
      - 'scripts/check-fx-minute-overlap.mjs'
      - '.github/workflows/fx-overlap-check.yml'

permissions:
  contents: write

concurrency:
  group: macro-news-fx-overlap
  cancel-in-progress: false

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 跑核对
        continue-on-error: true
        run: |
          set -o pipefail
          MODE='${{ github.event.inputs.mode }}'
          if [ "$MODE" = "probe-cross" ]; then
            node scripts/check-fx-minute-overlap.mjs --probe-cross 2>&1 | tee overlap.log
          else
            node scripts/check-fx-minute-overlap.mjs 2>&1 | tee overlap.log
          fi
          {
            echo "### 外汇分钟重叠核对 · $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')（北京）"
            echo ""
            echo '```'
            tail -n 60 overlap.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 记录运行状态（即使核对崩溃也要留证据）
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const p = 'data/kline/min/_overlap-run.json';
            const log = fs.existsSync('overlap.log') ? fs.readFileSync('overlap.log', 'utf8').slice(-6000) : '（没有 overlap.log：脚本可能根本没启动）';
            const hasResult = fs.existsSync('data/kline/min/_overlap.json');
            fs.writeFileSync(p, JSON.stringify({
              finishedAt: new Date().toISOString(),
              runner: process.env.RUNNER_NAME || '',
              jobStatus: process.env.JOB_STATUS || '',
              producedResult: hasResult,
              log
            }, null, 2));
            console.log('状态已写入', p, 'producedResult=', hasResult);
          "
        env:
          JOB_STATUS: ${{ job.status }}

      - name: 提交核对结果
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 复用仓库统一的推送脚本：SSH-443 推送会被随机 reset（实测连续 4 次失败很常见）。
        # ⚠ 必须用块标量：MSG_PREFIX 的值里有「chore: 」，写成单行 plain scalar 会被 YAML
        #   当成 mapping（run 名称变成文件路径、作业直接解析失败）。
        # ⚠ 不能提交 2026-11-21/…：.gitignore 故意忽略根目录日期产物目录，git add 会直接失败。
        run: |
          bash scripts/push-data.sh data/kline/min/_overlap.json data/kline/min/_overlap-run.json MSG_PREFIX="chore: 外汇分钟重叠核对结果"
