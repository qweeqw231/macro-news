name: 临时诊断-统计局源

# 临时：量化 GitHub runner 上 Happy Eyeballs 250ms 抢跑导致的失败率，并验证 IPv4 强制连接是否消除失败。
# 只做只读网络测试，不写 data/，跑完即删除本文件。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-stats.yml'

permissions:
  contents: read

concurrency:
  group: diag-stats
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 现行 fetch 路径连续 8 次（每次独立进程，模拟生产单轮）
        run: |
          cat > /tmp/one.mjs <<'EOF'
          const HOST = 'www.stats.gov.cn';
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36';
          const s = Date.now();
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 30000);
          try {
            const r = await fetch(`https://${HOST}/sj/zxfb/rss.xml`, {
              signal: ctrl.signal,
              headers: { 'User-Agent': UA, Accept: '*/*', Range: 'bytes=0-393215' },
            });
            const b = await r.text();
            console.log(`ok status=${r.status} bytes=${Buffer.byteLength(b)} ms=${Date.now() - s}`);
          } catch (e) {
            const c = e.cause;
            const sub = c?.errors ? ' | ' + c.errors.map((x) => (x.code || x.message) + ':' + (x.message || '')).join(' ; ') : '';
            console.log(`FAIL ms=${Date.now() - s} cause=${c?.code || c?.message || '-'}${sub}`);
          } finally { clearTimeout(timer); }
          EOF
          for i in $(seq 1 8); do node /tmp/one.mjs; done

      - name: autoSelectFamily 250ms vs 3000ms 对比（各 12 次）
        run: |
          cat > /tmp/race.mjs <<'EOF'
          import net from 'node:net';
          const HOST = 'www.stats.gov.cn';
          const V4 = process.argv[2];
          const V6 = process.argv[3];
          const attempt = Number(process.argv[4] || 0);
          const mk = (order) => (hostname, opts, cb) => {
            const list = order.map((a) => ({ address: a, family: a.includes(':') ? 6 : 4 }));
            if (opts && opts.all) cb(null, list); else cb(null, list[0].address, list[0].family);
          };
          const one = () => new Promise((res) => {
            const s = process.hrtime.bigint();
            const o = { host: HOST, port: 443, autoSelectFamily: true, lookup: mk([V4, V6]) };
            if (attempt) o.autoSelectFamilyAttemptTimeout = attempt;
            const sock = net.connect(o);
            const fin = (r) => { try { sock.destroy(); } catch {} res({ r, ms: Math.round(Number(process.hrtime.bigint() - s) / 1e6) }); };
            sock.setTimeout(15000, () => fin('local15s'));
            sock.on('connect', () => fin('ok'));
            sock.on('error', (e) => fin(e.errors ? e.errors.map((x) => x.code).join(',') : e.code));
          });
          const out = [];
          for (let i = 0; i < 12; i++) out.push(await one());
          const fails = out.filter((x) => x.r !== 'ok');
          console.log(`attempt=${attempt || 'default250'} 失败 ${fails.length}/12`, JSON.stringify(out));
          process.exit(0);
          EOF
          V4=$(node -e "require('node:dns').resolve4('www.stats.gov.cn',(e,a)=>console.log(a[0]))")
          V6=$(node -e "require('node:dns').resolve6('www.stats.gov.cn',(e,a)=>console.log(a[0]||''))")
          echo "V4=$V4 V6=$V6"
          node /tmp/race.mjs "$V4" "$V6" 0
          node /tmp/race.mjs "$V4" "$V6" 3000
