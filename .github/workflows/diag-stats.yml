name: 临时诊断-统计局源

# 临时：验证 autoSelectFamilyAttemptTimeout 250ms→3000ms 是否消除建连误判。
# 只做只读网络测试，不写 data/，跑完即删除本文件。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-stats.yml'

permissions:
  contents: read

concurrency:
  group: diag-stats
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 建连抢跑对比（默认 250ms vs 设定 3000ms，各 40 次）
        run: |
          cat > /tmp/race2.mjs <<'EOF'
          import net from 'node:net';
          import dns from 'node:dns';
          const HOST = 'www.stats.gov.cn';
          const [V4, V6] = await Promise.all([
            dns.promises.resolve4(HOST).then((a) => a[0]),
            dns.promises.resolve6(HOST).then((a) => a[0] || ''),
          ]);
          const mk = (order) => (hostname, opts, cb) => {
            const list = order.map((a) => ({ address: a, family: a.includes(':') ? 6 : 4 }));
            if (opts && opts.all) cb(null, list); else cb(null, list[0].address, list[0].family);
          };
          const one = () => new Promise((res) => {
            const s = process.hrtime.bigint();
            const sock = net.connect({ host: HOST, port: 443, autoSelectFamily: true, lookup: mk([V4, V6]) });
            const fin = (r) => { try { sock.destroy(); } catch {} res({ r, ms: Math.round(Number(process.hrtime.bigint() - s) / 1e6) }); };
            sock.setTimeout(15000, () => fin('local15s'));
            sock.on('connect', () => fin('ok'));
            sock.on('error', (e) => fin(e.errors ? e.errors.map((x) => x.code).join(',') : e.code));
          });
          const run = async (label, n = 40) => {
            const out = [];
            for (let i = 0; i < n; i++) out.push(await one());
            const fails = out.filter((x) => x.r !== 'ok');
            const okMs = out.filter((x) => x.r === 'ok').map((x) => x.ms).sort((a, b) => a - b);
            console.log(`${label}: 失败 ${fails.length}/${n} | 失败样本 ${JSON.stringify(fails)} | 成功 ms min=${okMs[0]} p50=${okMs[Math.floor(okMs.length / 2)]} max=${okMs[okMs.length - 1]}`);
          };
          console.log(`V4=${V4} V6=${V6}`);
          console.log('getDefaultAutoSelectFamilyAttemptTimeout =', net.getDefaultAutoSelectFamilyAttemptTimeout());
          await run('默认阈值(250ms)');
          net.setDefaultAutoSelectFamilyAttemptTimeout(3000);
          console.log('after set =', net.getDefaultAutoSelectFamilyAttemptTimeout());
          await run('设定阈值(3000ms)');
          process.exit(0);
          EOF
          node /tmp/race2.mjs
