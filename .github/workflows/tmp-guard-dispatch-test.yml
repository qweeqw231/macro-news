# 临时验证用：连续两次 dispatch pages.yml，观察第二次是否被 guard 跳过。
# 验证完成后本文件会删除，不进入常驻配置。
name: tmp-guard-dispatch-test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-guard-dispatch-test.yml'

permissions:
  contents: read
  actions: write

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: 连续两次 dispatch pages.yml
        run: |
          for i in 1 2; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "dispatch #$i -> HTTP $code at $(date -u '+%H:%M:%S') UTC"
            sleep 5
          done
